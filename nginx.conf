server {
    listen 80;
    server_name _;

    # 容器健康检查专用（不依赖 TLS / 后端）。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # 站点身份由 stack 的 identity/web/tls 目录投影进来：
    #   web.pem / web.key                     —— 浏览器侧的服务端证书
    #   web-client.pem / web-client.key       —— 访问 ctrl 的客户端证书
    #   ctrl-ca.pem                           —— 校验 ctrl 服务端证书的信任锚
    ssl_certificate     /etc/nginx/tls/web.pem;
    ssl_certificate_key /etc/nginx/tls/web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 管理面：与 gwlinkd↔Center 同构 —— 本容器作为**客户端**出示证书，
    # 并用显式信任锚校验 ctrl 的服务端证书。
    location /api {
        proxy_pass https://host.docker.internal:19091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;

        # 上游 mTLS
        proxy_ssl_trusted_certificate /etc/nginx/tls/ctrl-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        # 必须等于 ctrl 服务端证书的 SAN。
        proxy_ssl_name ingest-ctrl;
        proxy_ssl_certificate     /etc/nginx/tls/web-client.pem;
        proxy_ssl_certificate_key /etc/nginx/tls/web-client.key;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # SPA 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
