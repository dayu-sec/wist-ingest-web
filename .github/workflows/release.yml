name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  # 1. 发版前先校验：构建必须通过才发镜像。
  #
  #    为什么要在这里再做一次：ci.yml 的 push 过滤是 `branches`，**tag 推送不会触发它**，
  #    所以不加这一步，镜像可以在完全未经校验的情况下发布。
  #    检查内容与 ci.yml 保持一致（本项目暂无测试脚本；将来加了测试也加在这里）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # 2. 构建多架构镜像并推送 ghcr.io。
  docker:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：国内服务器拉 ghcr.io 很慢，客户端改用 TCR 地址。
      # 凭据在 TCR 控制台生成（访问凭证），存 GitHub Secrets：TCR_USERNAME / TCR_PASSWORD。
      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.1.3-alpha / -beta / -rc …）只推该 tag，**不覆盖 :latest**。
          # 否则 :latest 会指向预发布产物，而 wist-ingest-stack 是按固定 tag 拉镜像的。
          # 两个源（ghcr / TCR）同进退。
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-ingest-web"
          tags="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          tags="$(printf '%s\n%s' "$tags" "$tcr:${{ github.ref_name }}")"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              tags="$(printf '%s\n%s' "$tags" "ghcr.io/${{ github.repository }}:latest")"
              tags="$(printf '%s\n%s' "$tags" "$tcr:latest")"
              ;;
          esac
          printf 'tags<<__EOF__\n%s\n__EOF__\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64

# 本文件与 `wist-center-web` 的 release.yml 同构（镜像地址用 `github.repository`，
# 构建契约由仓库根 Dockerfile 满足：ARG APP_VERSION → ENV VITE_APP_VERSION）。
# 本仓的交付物就是镜像，因此没有单独的 GitHub Release job（与 wist-center-web 一致）。
