name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  # 发版前先校验：ci.yml 只过滤 branches，tag 推送不会触发它。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

  docker:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（-alpha / -beta / -rc）只推该 tag，不覆盖 :latest。
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-ingest-web"
          ref="${{ github.ref_name }}"
          # 一行一个 tag。不要写成 `printf '%s\n%s' a b c`：参数多于格式里的占位符时，
          # 第二轮从 `%s` 开始续写，会把最后两行粘成一个（`...:latest...:latest`）。
          tags_file="${RUNNER_TEMP}/image-tags.txt"
          printf '%s\n' "$ghcr:$ref" "$tcr:$ref" > "$tags_file"
          case "$ref" in
            *-*) ;;
            *) printf '%s\n' "$ghcr:latest" "$tcr:latest" >> "$tags_file" ;;
          esac
          {
            echo "tags<<__EOF__"
            cat "$tags_file"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64

  release:
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
